[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "choops-extractor-reborn"
version = "1.1.0"
requires-python = ">=3.11"
description = "Preservation-first PS3 College Hoops 2K8 archive tools"
[project.optional-dependencies]
test = ["pytest>=8"]
[project.scripts]
choops = "choops_py.cli:main"
[tool.setuptools.packages.find]
include = ["choops_py*"]
[tool.setuptools.package-data]
choops_py = ["archive/names.json"]
[tool.pytest.ini_options]
testpaths = ["tests"]
