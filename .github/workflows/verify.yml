name: Verify native Python studio
on:
  push:
    branches: [master, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux Qt runtime dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall choops_py tests
      - run: python -m unittest discover -s tests -v
      - run: python -m pytest -q
      - run: python -m choops_py.cli --help
      - run: python -m choops_py.studio --smoke
      - run: python -m ruff check choops_py/studio choops_py/modding/patch_package.py
      - run: python -m mypy choops_py/studio choops_py/modding/patch_package.py --follow-imports=skip --ignore-missing-imports
      - name: Windows standalone build and smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/rebuild/package_windows.ps1
